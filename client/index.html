<!DOCTYPE html>
<html lang="en" class="dark">

    <!-- JSON-LD Structured Data (SoftwareApplication & Organization) -->

      "@context": "https://schema.org",

          "name": "ZENITH",

            "name": "IMV"

            "priceCurrency": "USD"

            "Automated Approaching Deadline Reminders",
            "Academic AI Copilot Assistant"

        },
        {
          "@type": "Organization",
          "name": "IMV",

        }
      ]
    }

    <!-- Google Fonts: Plus Jakarta Sans -->
